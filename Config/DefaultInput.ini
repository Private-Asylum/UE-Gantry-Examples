; GantryExamples input configuration.
;
; Actual bindings live in Enhanced Input assets (Input Actions and Input Mapping Contexts), not
; here. This file only chooses the classes that back the input system.

[/Script/Engine.InputSettings]
; Enhanced Input's player input class. Required for mapping contexts to work at all.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput

; The project component adds tag-driven binding on top of UEnhancedInputComponent. Both player
; controllers and pawns get it from here, so no per-class wiring is needed.
DefaultInputComponentClass=/Script/GantryExamples.GTEnhancedInputComponent

bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bEnableFOVScaling=True
bCaptureMouseOnLaunch=True
bEnableLegacyInputScales=True
bEnableMotionControls=True
bFilterInputByPlatformUser=False
bEnableInputDeviceSubsystem=True
bShouldFlushPressedKeysOnViewportFocusLost=True
bEnableDynamicComponentInputBinding=True
bAlwaysShowTouchInterface=False
bShowConsoleOnFourFingerTap=True
bEnableGestureRecognizer=False
bUseAutocorrect=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
FOVScale=0.011110
DoubleClickTime=0.200000

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bSendTriggeredEventsWhenInputIsFlushed=True
bEnableUserSettings=True
bEnableDefaultMappingContexts=True
bShouldOnlyTriggerLastActionInChord=True
bLogOnDeprecatedConfigUsed=True
