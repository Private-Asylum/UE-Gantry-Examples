[Linux.SDL]
; SDL3 (UE 5.8+) auto-detects and prefers wayland; Slate needs absolute
; screen coordinates, which wayland does not provide. Force XWayland.
; Redundant with the engine default, kept explicit so the project is
; correct on any engine build.
VideoDriver=x11
