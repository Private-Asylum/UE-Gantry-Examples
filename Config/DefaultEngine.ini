; GantryExamples engine configuration.
;
; A Blueprint-only project: no class overrides point at project code, because there is none.
; Everything game-specific is a Blueprint chosen by the maps' and experiences' own settings.

[/Script/Engine.Engine]
; Gantry's asset manager: records every load as a named scope the loading screen can show.
; Required by the Load Assets stage and the tracked loading nodes.
AssetManagerClassName=/Script/GantryGauge.GantryAssetManager

NearClipPlane=5.000000

[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Game/Yardrush/Core/BP_YR_GameMode.BP_YR_GameMode_C
GlobalDefaultServerGameMode=/Game/Yardrush/Core/BP_YR_GameMode.BP_YR_GameMode_C
GameInstanceClass=/Game/Yardrush/Core/BP_YR_GameInstance.BP_YR_GameInstance_C
EditorStartupMap=/Game/Maps/L_GantryStart.L_GantryStart
GameDefaultMap=/Game/Yardrush/Maps/L_Yard.L_Yard
ServerDefaultMap=/Game/Yardrush/Maps/L_Yard.L_Yard
TransitionMap=
LocalMapOptions=
bUseSplitscreen=False

[/Script/Engine.GameEngine]
; Net driver definitions. Left at engine defaults; override here when adding a custom driver.

[/Script/Engine.CollisionProfile]
; Project trace channels. Adding them here rather than through the editor UI keeps the mapping
; between the ECC_GameTraceChannelN enum and its display name under source control.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,Name="Projectile",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,Name="Interaction",DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False)
+Profiles=(Name="Projectile",CollisionEnabled=QueryOnly,ObjectTypeName="Projectile",CustomResponses=,HelpMessage="Preset for projectiles",bCanModify=True)
+EditProfiles=(Name="Trigger",CustomResponses=((Channel=Projectile,Response=ECR_Ignore)))

[/Script/AIModule.AISystem]
bForgetStaleActors=True

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=1
AudioMaxChannels=0
AudioNumSourceWorkers=4
SpatializationPlugin=
SourceDataOverridePlugin=
ReverbPlugin=
OcclusionPlugin=
CompressionOverrides=(bOverrideCompressionTimes=False,DurationThreshold=5.000000,MaxNumRandomBranches=0,SoundCueQualityIndex=0)
CacheSizeKB=65536
MaxChunkSizeOverrideKB=0
bResampleForDevice=False
MaxSampleRate=48000.000000
HighSampleRate=32000.000000
MedSampleRate=24000.000000
LowSampleRate=12000.000000
MinSampleRate=8000.000000
CompressionQualityModifier=1.000000
AutoStreamingThreshold=0.000000
SoundCueCookQualityIndex=-1

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WorldPartitionEditor.WorldPartitionEditorSettings]
CommandletClass=Class'/Script/UnrealEd.WorldPartitionConvertCommandlet'

[Core.Log]
; Per-channel verbosity. Raise any of these to Verbose while working on that area.
LogGantryCore=Log
LogGantryGauge=Log
LogGantryExperience=Log

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=True
bAllowNetworkConnection=True
SecurityToken=01A03D3E3CD3778BADFB5EA904972686
bIncludeInShipping=False
bAllowExternalStartInShipping=False
bCompileAFSProject=False
bUseCompression=False
bLogFiles=False
bReportStats=False
ConnectionType=USBOnly
bUseManualIPAddress=False
ManualIPAddress=


[Linux.SDL]
; SDL3 (UE 5.8+) auto-detects and prefers wayland; Slate needs absolute
; screen coordinates, which wayland does not provide. Force XWayland.
; Redundant with the engine default, kept explicit so the project is
; correct on any engine build.
VideoDriver=x11

[/Script/NavigationSystem.RecastNavMesh]
; Yardrush's rounds drop containers into the yard while it is being played; bots path around them.
RuntimeGeneration=Dynamic
