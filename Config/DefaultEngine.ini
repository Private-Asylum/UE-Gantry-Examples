; GantryExamples engine configuration.
;
; Class overrides below are what tie the C++ framework classes into the engine. Without them the
; engine silently uses its own defaults and none of the project code ever runs.

[/Script/Engine.Engine]
; Process-level engine class. Editor targets use UUnrealEdEngine instead and ignore this.
GameEngine=/Script/GantryExamples.GTGameEngine

; Bridge between the OS window and the game.
GameViewportClientClassName=/Script/GantryExamples.GTGameViewportClient

; One per local human, outlives every map.
LocalPlayerClassName=/Script/GantryExamples.GTLocalPlayer

; Per-map settings actor, edited from World Settings.
WorldSettingsClassName=/Script/GantryExamples.GTWorldSettings

; Parent class for every level Blueprint created from now on.
LevelScriptActorClassName=/Script/GantryExamples.GTLevelScriptActor

; Controller spawned for pawns with no explicit AI controller class.
AIControllerClassName=/Script/GantryExamples.GTAIController

; Created before the game instance; owns primary asset scanning.
AssetManagerClassName=/Script/GantryExamples.GTAssetManager

; Per-machine player settings, saved to Saved/Config/<Platform>/GameUserSettings.ini.
GameUserSettingsClassName=/Script/GantryExamples.GTGameUserSettings

NearClipPlane=5.000000

+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/GantryExamples")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/GantryExamples")

[/Script/EngineSettings.GameMapsSettings]
; Session-scoped game instance, outer for every UGTGameInstanceSubsystem.
GameInstanceClass=/Script/GantryExamples.GTGameInstance

GlobalDefaultGameMode=/Script/GantryExamples.GTGameMode
GlobalDefaultServerGameMode=/Script/GantryExamples.GTGameMode
EditorStartupMap=/Game/Experiences/Sandbox/Maps/L_Sandbox.L_Sandbox
GameDefaultMap=/Game/Experiences/Sandbox/Maps/L_Sandbox.L_Sandbox
ServerDefaultMap=/Engine/Maps/Entry
TransitionMap=
LocalMapOptions=
bUseSplitscreen=True
TwoPlayerSplitscreenLayout=Horizontal
ThreePlayerSplitscreenLayout=FavorTop

[/Script/Engine.GameEngine]
; Net driver definitions. Left at engine defaults; override here when adding a custom driver.

[/Script/Engine.CollisionProfile]
; Project trace channels. Adding them here rather than through the editor UI keeps the mapping
; between the ECC_GameTraceChannelN enum and its display name under source control.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,Name="Projectile",DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False)
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,Name="Interaction",DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False)
+Profiles=(Name="Projectile",CollisionEnabled=QueryOnly,ObjectTypeName="Projectile",CustomResponses=,HelpMessage="Preset for projectiles",bCanModify=True)
+EditProfiles=(Name="Trigger",CustomResponses=((Channel=Projectile,Response=ECR_Ignore)))

[/Script/AIModule.AISystem]
bForgetStaleActors=True

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
