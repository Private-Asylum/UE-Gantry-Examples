+Entries=(Kind=Class,Path="/YardCrateRush/Round/BP_CR_Crate.BP_CR_Crate_C",Member="",Namespace="Yardrush",Since="",Deprecated="",Description="A crate to carry. Replicated: the server spawns, carries and moves it, and every machine sees where it is. It never blocks anyone; carriers find crates by distance, and consider only crates tagged Free (on the ground, not carried). Put down in a bay, it scores Points for that team and goes back to a crate container\'s doors. Crates register with the Game Framework Component Manager, so game features (and mods) can add components to them; the body (Box) carries the component tag Paint for anything that restyles it.")
