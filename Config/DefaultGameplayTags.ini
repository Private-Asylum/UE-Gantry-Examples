; Gameplay tag configuration.
;
; The tags used by C++ are declared natively in Source/GantryExamples/Core/Tags/GTGameplayTags.h so
; the compiler catches typos. Tags added by designers go into the .ini source below, which the
; editor writes to. Both sets merge into one tree at runtime.

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
AllowEditorTagUnloading=True
AllowGameTagUnloading=False
FastReplication=False
InvalidTagCharacters="\"',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; Gantry filters its experience-identity tag pickers on the semantic category "Gantry.ExperienceId",
; which deliberately has no tags under it. Unmatched filters are dropped by the tag manager, so
; without this line the picker just offers the whole tree. This narrows it to the project's own root
; so designers are led to the right place instead of scrolling past every Input and UI tag.
+CategoryRemapping=(BaseCategory="Gantry.ExperienceId",RemapCategories=("GT.Experience"))
