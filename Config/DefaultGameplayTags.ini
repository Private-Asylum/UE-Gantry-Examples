; Gameplay tag configuration.
;
; A Blueprint-only project: every tag lives in ini. Experience identities are under Experience.*,
; Yardrush's own tags under Yard.*.

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
AllowEditorTagUnloading=True
AllowGameTagUnloading=False
FastReplication=False
InvalidTagCharacters="\"',"
NumBitsForContainerSize=6
NetIndexFirstBitSegment=16

; Gantry filters its experience-identity tag pickers on the semantic category "Gantry.ExperienceId",
; which deliberately has no tags under it. Unmatched filters are dropped by the tag manager, so
; without this line the picker just offers the whole tree. This narrows it to the project's own root
; so designers are led to the right place instead of scrolling past every Input and UI tag.
+CategoryRemapping=(BaseCategory="Gantry.ExperienceId",RemapCategories=("Experience"))

; Experience identities (Gantry): one tag per experience in the tree.
+GameplayTagList=(Tag="Experience.Base",DevComment="Root of the example project's experience tree.")
+GameplayTagList=(Tag="Experience.Guide",DevComment="The start map's guide.")
+GameplayTagList=(Tag="Experience.Yard",DevComment="Yardrush: everything every round shares.")
+GameplayTagList=(Tag="Experience.Yard.Lobby",DevComment="Yardrush: between rounds, players gather and vote.")
+GameplayTagList=(Tag="Experience.Yard.CrateRush",DevComment="Yardrush round: push crates into your team's bay.")

; Yardrush.
+GameplayTagList=(Tag="Yard.Stage.LowerContainers",DevComment="Stage kind: the crane delivers the round's containers.")
+GameplayTagList=(Tag="Yard.Stage.Countdown",DevComment="Stage kind: the pre-round countdown.")
+GameplayTagList=(Tag="Yard.Team.Red",DevComment="")
+GameplayTagList=(Tag="Yard.Team.Blue",DevComment="")
