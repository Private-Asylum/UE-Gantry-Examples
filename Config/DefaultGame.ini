; GantryExamples game configuration.

[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=01A02731140B7D6E94B0840C1AE1E1EC
ProjectName=GantryExamples
CopyrightNotice=Copyright Private Asylum LLC, 2026, All Rights Reserved.
ProjectVersion=0.0.1.0
CompanyName=Private Asylum LLC
ProjectDisplayedTitle=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDisplayedTitle", "{GameName}")
ProjectDebugTitleInfo=NSLOCTEXT("[/Script/EngineSettings]", "ProjectDebugTitleInfo", "{GameName}-{BuildConfiguration}-{RHIName}")

[/Script/GantryExamples.GTDeveloperSettings]
; Project-wide gameplay settings. Also editable at Project Settings -> Game -> GantryExamples.
BuildId=local
BuildEnvironment=Development
FrontEndMap=
SaveGameClass=/Script/GantryExamples.GTSaveGame
AutosaveIntervalSeconds=300.000000
bShowDebugHUDByDefault=False

[/Script/GantryCore.GantryCoreSettings]
; Shared Gantry settings. Also at Project Settings -> Plugins -> Gantry Core.
FrameworkTagRoot=Gantry
bWarnOnUnregisteredTags=True

[/Script/GantryGauge.GantryGaugeSettings]
; Load ledger and streaming instrumentation. Class selections are empty, meaning "use Gantry's own"; a
; game overrides one by naming its subclass, e.g.
;   StreamingSubsystemClass=/Script/MyGame.MyGameStreamingSubsystem
StreamingSubsystemClass=
bEnableLoadLedger=True
bTrackIndividualAssets=True
LoadDetailPollInterval=0.100000
CompletedScopeHistorySize=64
bWarnOnBlockingLoads=True

[/Script/GantryExperience.GantryExperienceSettings]
ExperienceSubsystemClass=
; The root of the experience tree: a UGantryBaseExperienceDefinition asset. Its Children listing
; is the project's content registry — everything activatable must be reachable from it. The
; default (auto-activated) experience is declared on the base asset itself, not here.
BaseExperience=/Game/Experiences/EXP_Base.EXP_Base
ExperienceStageStallWarningTime=15.000000

[/Script/Engine.AssetManagerSettings]
; Primary asset types the asset manager scans at startup. Add a row per data asset family so it
; can be discovered and async loaded by id instead of by hard reference.
+PrimaryAssetTypesToScan=(PrimaryAssetType="Map",AssetBaseClass="/Script/Engine.World",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Maps")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="GantryExperience",AssetBaseClass="/Script/GantryExperience.GantryExperienceDefinition",bHasBlueprintClasses=True,bIsEditorOnly=False,Directories=((Path="/Game/Experiences")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
+PrimaryAssetTypesToScan=(PrimaryAssetType="GTGameData",AssetBaseClass="/Script/Engine.PrimaryDataAsset",bHasBlueprintClasses=True,bIsEditorOnly=False,Directories=((Path="/Game/Data")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
bOnlyCookProductionAssets=False
bShouldManagerDetermineTypeAndName=False
bShouldGuessTypeAndNameInEditor=True
bShouldAcquireMissingChunksOnLoad=False
MetaDataTagsForAssetRegistry=()

[/Script/UnrealEd.ProjectPackagingSettings]
Build=IfProjectHasCode
BuildConfiguration=PPBC_Development
BuildTarget=
FullRebuild=False
ForDistribution=False
IncludeDebugFiles=False
BlueprintNativizationMethod=Disabled
UsePakFile=True
bUseIoStore=True
bUseZenStore=False
bMakeBinaryConfig=False
bGenerateChunks=False
bGenerateNoChunks=False
bChunkHardReferencesOnly=False
bForceOneChunkPerFile=False
MaxChunkSize=0
bBuildHttpChunkInstallData=False
+DirectoriesToAlwaysCook=(Path="/Game/Maps")
+DirectoriesToAlwaysCook=(Path="/Game/Data")

[/Script/CommonUI.CommonUISettings]
CommonButtonAcceptKeyHandling=TriggerClick

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

[/Script/GameFeatures.GameFeaturesSubsystemSettings]
; Gantry's policy subclass. This is what enforces shipped-unit compatibility: a plugin built against
; a different engine, or outside the game version range it declares, is refused before it mounts
; rather than failing somewhere downstream.
GameFeaturesManagerClassName=/Script/GantryExperience.GantryGameFeaturesProjectPolicies

[/Script/GantryExperience.GantryGameFeaturesProjectPolicies]
; Turn off to log incompatibilities as warnings and let them through, which is usually what you want
; while iterating locally. Shipped builds should leave this on.
bEnforceCompatibility=True
